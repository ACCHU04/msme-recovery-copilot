# Render Blueprint: backend in Singapore (Render has no India region).
# Use a paid instance type: free instances sleep when idle and the first request is slow.
services:
  - type: web
    name: settle45-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET      # only for projects on the legacy JWT secret
        sync: false
