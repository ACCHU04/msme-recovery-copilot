# Fly.io: backend in Mumbai, always on (no cold starts).
# First time:  cd backend && fly launch --no-deploy --copy-config   (pick a unique app name)
# Secrets:     fly secrets set STORE=supabase SUPABASE_URL=... SUPABASE_SERVICE_KEY=... \
#                CORS_ORIGINS=https://your-site.vercel.app GEMINI_API_KEY=...
# Deploy:      fly deploy
app = "settle45-api"            # change to your own unique name
primary_region = "bom"          # Mumbai; use "sin" (Singapore) if bom is unavailable to your account

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # never sleep: no cold start on the first request
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
